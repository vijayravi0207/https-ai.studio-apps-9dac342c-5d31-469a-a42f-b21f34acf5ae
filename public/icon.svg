<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="concrete" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#f59e0b" stroke-width="6" opacity="0.3" />
  
  <!-- Concrete Mixer Drum / Abram's Slump Cone Motif -->
  <g transform="translate(256, 256)">
    <!-- Base Plate -->
    <rect x="-140" y="110" width="280" height="24" rx="8" fill="#334155" stroke="#64748b" stroke-width="4" />
    
    <!-- Abram's Slump Cone Shape -->
    <polygon points="-50,-120 50,-120 100,100 -100,100" fill="url(#gold)" stroke="#d97706" stroke-width="6" />
    
    <!-- Slump Cone Handles -->
    <path d="M -75,-10 L -115,-10 L -115,25 L -85,25" fill="none" stroke="#fef3c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 75,-10 L 115,-10 L 115,25 L 85,25" fill="none" stroke="#fef3c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Measurement Scale Tamping Rod -->
    <line x1="-120" y1="-120" x2="120" y2="-120" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" />
    <line x1="0" y1="-120" x2="0" y2="-30" stroke="#ef4444" stroke-width="6" stroke-dasharray="8 6" stroke-linecap="round" />
    <circle cx="0" cy="-30" r="10" fill="#ef4444" />
    
    <!-- Text Badge: IS 10262 -->
    <rect x="-80" y="30" width="160" height="38" rx="8" fill="#0f172a" opacity="0.9" />
    <text x="0" y="55" fill="#fef08a" font-family="monospace" font-size="20" font-weight="900" text-anchor="middle">IS 10262</text>
  </g>
</svg>
